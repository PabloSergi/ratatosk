services:
  # Where a run's rows are kept. Its own container and its own volume: an installation brings its
  # database with it rather than expecting to find one, which is the difference between "clone and run"
  # and "clone, then set up a database that something else on this machine is already using".
  db:
    image: postgres:17-alpine
    container_name: ratatosk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratatosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratatosk}
      POSTGRES_DB: ${POSTGRES_DB:-ratatosk}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No port is published. Nothing outside this stack has any business reaching it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ratatosk} -d $${POSTGRES_DB:-ratatosk}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # The line of work between the schedule and the worker, and the lock that keeps one scraper from
  # walking a site in two browsers at once. Nothing durable lives here: everything worth keeping is in
  # Postgres, so this container can be thrown away and rebuilt without losing anything.
  queue:
    image: redis:8-alpine
    container_name: ratatosk-queue
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # The operator view. Bound to localhost on purpose: reach it over an SSH tunnel, not over the internet.
  web:
    build: .
    image: ratatosk:local
    container_name: ratatosk-web
    restart: unless-stopped
    command: ["node", "dist/web.js"]
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    ports:
      - "127.0.0.1:5544:5544"
    environment:
      HOST: 0.0.0.0
      PORT: 5544
      # No API key here on purpose: every account adds its own in the web view, stored per account.
      RATATOSK_MODEL: ${RATATOSK_MODEL:-qwen/qwen3.7-flash}
      # One browser per account, capped: a headed Chromium is not free.
      RATATOSK_MAX_BROWSERS: ${RATATOSK_MAX_BROWSERS:-3}
      RATATOSK_PROFILES: /app/profiles
      RATATOSK_HISTORY: /app/history
      RATATOSK_MEMORY: /app/memory
      RATATOSK_RESULTS: /app/results
      # With this set, runs are kept in Postgres; without it, in files. Nothing else decides.
      RATATOSK_DB: postgres://${POSTGRES_USER:-ratatosk}:${POSTGRES_PASSWORD:-ratatosk}@db:5432/${POSTGRES_DB:-ratatosk}
      RATATOSK_REDIS: redis://queue:6379
      # debug | info | warn | error — one JSON line per event, read them with the logs service below.
      RATATOSK_LOG: ${RATATOSK_LOG:-info}
    volumes:
      - ./robots:/app/robots
      # What every robot did, kept across deploys: this is the product's memory, not a cache.
      - ./history:/app/history
      # What each scraper has already returned, so a posting reposted every ten minutes is news once.
      - ./memory:/app/memory
      # And what its last few runs actually brought back, so "I ran it yesterday" is answerable today.
      - ./results:/app/results
      - ./rules:/app/rules:ro
      - browser-profiles:/app/profiles
      # The Telegram session belongs to whoever logged in — it lives here and nowhere else.
      - account-secrets:/app/secrets
    # A browser eats whatever it is given. The swap limit matters more than the memory one: without it
    # a runaway page drags the whole host into swap instead of the container dying alone.
    mem_limit: 5g
    memswap_limit: 5g
    shm_size: 1g

  # What runs what is due. Its own container, because a run holds a browser open for a minute at a
  # gigabyte a time: sharing a process with the thing serving the screen means one heavy scrape makes
  # the interface stop answering, and nobody can tell a busy scraper from a dead service.
  worker:
    build: .
    image: ratatosk:local
    container_name: ratatosk-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    environment:
      RATATOSK_DB: postgres://${POSTGRES_USER:-ratatosk}:${POSTGRES_PASSWORD:-ratatosk}@db:5432/${POSTGRES_DB:-ratatosk}
      RATATOSK_REDIS: redis://queue:6379
      RATATOSK_LOG: ${RATATOSK_LOG:-info}
      RATATOSK_MODEL: ${RATATOSK_MODEL:-qwen/qwen3.7-flash}
      # One browser at a time here: this container exists to be steady, not fast.
      RATATOSK_MAX_BROWSERS: ${RATATOSK_WORKER_BROWSERS:-1}
      RATATOSK_PROFILES: /app/profiles
      RATATOSK_HISTORY: /app/history
      RATATOSK_MEMORY: /app/memory
      RATATOSK_RESULTS: /app/results
    volumes:
      # The same folders the web service uses: a scheduled run and a pressed button are the same act,
      # so they read the same scrapers and write the same history.
      - ./robots:/app/robots
      - ./history:/app/history
      - ./memory:/app/memory
      - ./results:/app/results
      - ./rules:/app/rules:ro
      - browser-profiles:/app/profiles
      - account-secrets:/app/secrets
    mem_limit: 3g
    memswap_limit: 3g
    shm_size: 1g

  # The MCP server speaks stdio, so a client starts it on demand:
  #   docker compose run --rm -T mcp
  mcp:
    build: .
    image: ratatosk:local
    profiles: ["manual"]
    stdin_open: true
    environment:
      RATATOSK_MODEL: ${RATATOSK_MODEL:-qwen/qwen3.7-flash}
      RATATOSK_LOG: ${RATATOSK_LOG:-info}
    volumes:
      - ./robots:/app/robots
      - ./rules:/app/rules:ro
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 1g

  # Live logs of every container, searchable, in a browser. Twenty megabytes and no database — the
  # alternative was a three-container logging stack on a box that has already died of swap once.
  #
  # The docker socket is mounted read-only and the port is bound to loopback: this can watch, and it is
  # reachable only through the same tunnel as everything else here.
  logs:
    image: amir20/dozzle:latest
    container_name: ratatosk-logs
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: "name=ratatosk"
    ports:
      - "127.0.0.1:5545:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m

volumes:
  browser-profiles:
  account-secrets:
  db-data:
